apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: emp-frontend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: emp-fe-dp
  minReplicas: 2
  maxReplicas: 5
  metrics: 
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
