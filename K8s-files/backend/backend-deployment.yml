apiVersion: apps/v1
kind: Deployment   # mentioning the resource is deployment
metadata:
  name: demo-emp-backend-dp  # name of the deployment resource
  namespace: demo-emp 
spec:
  replicas: 1 # number of identical pods required
  selector:  # identify the pods which has the below label
    matchLabels:
      app: emp-backend  
  template:
    metadata:
      labels:
        app: emp-backend # labled to be given to the pods which are under this deployment
    spec:
      imagePullSecrets:
        - name: dock-cred
      containers:
        - name: emp-app  # name of the container 
          image: sujeeeth29/employee-management-be:1.0.105  # image to be used by the containers
          # imagePullPolicy: Always
          ports: 
            - containerPort: 8080  # port number on which containers would run
          resources:
            requests:
              cpu: 100m
              memory: 500Mi
            limits:
              cpu: 300m
              memory: 1Gi
          env:  # mentioning the environment variables required for the container to run
            - name: MYSQL_HOST  # variable name
              value: "emp-db-service" # direct values mentioning for the variable
            - name: MYSQL_DB # variable name
              valueFrom: # mentioning the value to be taken from other k8s object
                secretKeyRef: # mentioning the values to be taken from object Secrets
                  name: backend-sc # Secret object name
                  key: MYSQL_DATABASE # which key value to be taken from the object secrets
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: backend-sc
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-sc
                  key: MYSQL_PASSWORD
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:  # mentioning the value to be taken from the object ConfigMap
                  name: emp-cm # name of the configmap object
                  key: port  # which key value to be taken from the configmap object
            - name: MYSQL_SSL_MODE
              valueFrom:
                configMapKeyRef:
                  name: emp-cm
                  key: ssl_status
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-sc
                  key: jwt-token
          startupProbe:
            httpGet:
              path: /api/departments
              port: 8080
            initialDelaySeconds: 100
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/departments
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/departments
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10