apiVersion: v1
kind: Service
metadata:
  name: demo-emp-backend-cip   # name of the service
  namespace: demo-emp
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /api/employees
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/success-codes: "200-399"
spec:
  selector:
    app: emp-backend  # pod lables of deployment 
  ports:
    - protocol: TCP  # 
      port: 8080 # port number on which we  would like to expose the service
      targetPort: 8080  # port on which actual pods are running
  type: ClusterIP # this decides the service is ClusterIP